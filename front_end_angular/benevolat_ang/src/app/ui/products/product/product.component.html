<main class="vh-100">
    <div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-light" *ngIf="products"
    style="background-image: url('data:image/jpeg;base64,{{products[0].photo}}');background-size: cover; background-position: center;">
      <div class="col-md-5 p-lg-5 mx-auto my-5">
        <h1 class="display-4 fw-normal text-white">{{products[0].name}}</h1>
        <p class="lead fw-normal text-white">And an even wittier subheading to boot. Jumpstart your marketing efforts with this example based on Apple’s marketing pages.</p>
        <a class="btn btn-outline-secondary" routerLink="/products">Coming soon</a>
      </div>
    </div>


    <div class=" w-100 my-md-3 ps-md-3 row  ms-1 mb-2" >
      <div class="me-md-3 pt-3 px-3 mb-3 pt-md-5 px-md-5 text-center overflow-hidden  col col-md-6 col-12" style="width: 48.9%;" 
      *ngFor="let product of appState.productState.products; let i = index" 
      [class.bg-dark]="(i % 3 === 0)"
      [class.text-white]="(i % 3 === 0)"
      [ngClass]="(i % 4 === 0) ? 'bg-primary bg-gradient' : 'bg-light'"
    
      
      >
        <div class="my-3 p-3">
          <a class="display-5 h2 text-decoration-none" (click)="gotoDetail(product.ProductID)">{{product.name}}</a>

          <p class="lead">And an even wittier subheading.</p>
        </div>
        <div class="bg-dark shadow-sm mx-auto" style="width: 80%; height: 300px; border-radius: 21px 21px 0 0;">
          <img  class="img-fluid rounded-top-4 border border-secondary" width="521" height="5" src="data:image/jpeg;base64,{{product.photo}}" alt="Photo of {{product.name}}"/>
        </div>
      </div>
    </div>
  </main>
