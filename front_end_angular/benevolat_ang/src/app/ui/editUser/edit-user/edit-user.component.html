<div class="row m-3">
    <div class="col-6">
        <form [formGroup]="customerFormGroup" *ngIf="customerFormGroup">
            <!-- {{customerFormGroup.value | json}}  -->
            
              <div class="row">
                <div class="col">
                  <input type="text" class="form-control" formControlName="username" placeholder="Enter username" name="username">
                </div>
                <div class="col">
                  <input type="password" formControlName="password" class="form-control" placeholder="Enter password" name="pswd">
                </div>
              </div> <!-- end-row -->
              
              <div class="mb-3 mt-3">
                <label for="name" class="form-label" >Name:</label>
                <input type="text"  formControlName="name" class="form-control" id="name" placeholder="Enter name" name="name">
            </div>
        
            <div class="mb-3 mt-3">
              <label for="email" class="form-label">Lastname:</label>
              <input type="email" formControlName="lastName" class="form-control" id="lastname" placeholder="Enter lastname" name="lastname">
          </div>
        
          <div class="mb-3 mt-3">
            <label for="email" class="form-label">Phone:</label>
            <input type="email" formControlName="phone" class="form-control" id="phone" placeholder="Enter phone" name="phone">
        </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Address:</label>
                  <input type="text" formControlName="address" class="form-control" id="address" placeholder="Enter address" name="address">
                </div>
                <div class="form-check mb-3">
                  <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="remember"> Remember me
                  </label>
                </div>
                <div class=" d-flex justify-content-between">
                <button type="button" class="btn btn-primary mb-2" (click)="returnPageCustomers()">Return</button>
                <button type="submit" class="btn btn-primary mb-2" [disabled]="customerFormGroup.invalid" (click)="EditCustomer()">Edit</button>
                </div>
                
            </form>
    </div>
</div>
